version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - |
          required_vars="MONGODB_URI NEXTAUTH_SECRET NEXTAUTH_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GEMINI_API_KEY S3_REGION S3_BUCKET_NAME S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY SES_REGION SES_FROM_EMAIL ADMIN_EMAILS"
          for variable in $required_vars; do
            if [ -z "$(printenv "$variable")" ]; then
              echo "Missing required Amplify environment variable: $variable"
              exit 1
            fi
          done
          echo "Required application, S3, SES, and admin environment variables are present"
        - |
          printf '%s\n' \
            "MONGODB_URI=$MONGODB_URI" \
            "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" \
            "NEXTAUTH_URL=$NEXTAUTH_URL" \
            "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
            "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID" \
            "GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET" \
            "S3_REGION=$S3_REGION" \
            "S3_BUCKET_NAME=$S3_BUCKET_NAME" \
            "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" \
            "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" \
            "SES_REGION=$SES_REGION" \
            "SES_FROM_EMAIL=$SES_FROM_EMAIL" \
            "ADMIN_EMAILS=$ADMIN_EMAILS" \
            "GEMINI_API_KEY=$GEMINI_API_KEY" \
            > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
